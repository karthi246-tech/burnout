<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Check-In</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

    <div class="logo">🌱 WellBeing</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="checkin.html">Check-In</a>
        <a href="history.html">History</a>
        <a href="analytics.html">Analytics</a>
        <a href="profile.html">Profile</a>
    </nav>

</header>

<main class="container">

    <h1>📝 Daily Well-Being Check-In</h1>

    <form id="checkinForm">

        <label>Date</label>
        <input type="date" id="date" required>

        <label>Mood</label>

        <select id="mood" required>
            <option value="">Select Mood</option>
            <option value="5">😊 Very Happy</option>
            <option value="4">🙂 Happy</option>
            <option value="3">😐 Neutral</option>
            <option value="2">😔 Sad</option>
            <option value="1">😞 Very Sad</option>
        </select>

        <label>Stress Level</label>

        <select id="stress" required>
            <option value="">Select Stress Level</option>
            <option value="1">1 - Very Low</option>
            <option value="2">2 - Low</option>
            <option value="3">3 - Moderate</option>
            <option value="4">4 - High</option>
            <option value="5">5 - Very High</option>
        </select>

        <label>Study Hours</label>

        <input
            type="number"
            id="study"
            min="0"
            max="24"
            step="0.5"
            placeholder="Example: 6"
            required
        >

        <label>Sleep Duration</label>

        <input
            type="number"
            id="sleep"
            min="0"
            max="24"
            step="0.5"
            placeholder="Example: 7"
            required
        >

        <label>Motivation Level</label>

        <select id="motivation" required>
            <option value="">Select Motivation</option>
            <option value="1">1 - Very Low</option>
            <option value="2">2 - Low</option>
            <option value="3">3 - Moderate</option>
            <option value="4">4 - High</option>
            <option value="5">5 - Very High</option>
        </select>

        <label>Additional Notes</label>

        <textarea
            id="notes"
            rows="5"
            placeholder="How was your day?"
        ></textarea>

        <button type="submit" class="btn">
            Save Daily Check-In
        </button>

    </form>

    <div id="message"></div>

</main>

<footer>
    <p>Take care of your mind and body 🌱</p>
</footer>

<script src="js/app.js"></script>

</body>
</html>
